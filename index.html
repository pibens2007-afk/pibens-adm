<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="PIBENS ADM — Gestão eclesiástica com inteligência">
  <title>PIBENS ADM</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="https://i.imgur.com/P9c9ypS.png">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos globais -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- ============================================================
       TELA DE LOGIN (aparece se não tiver sessão válida)
       ============================================================ -->
  <div id="login-screen" class="login-screen" style="display: none;">
    <div class="login-box">
      <div class="login-logo">🏛️</div>
      <h1 class="login-title">PIBENS ADM</h1>
      <p class="login-subtitle">Gestão eclesiástica com inteligência</p>

      <form id="login-form" onsubmit="Auth.handleLogin(event)">
        <div class="login-field">
          <i class="fas fa-lock login-field-icon"></i>
          <input
            type="password"
            id="login-password"
            placeholder="Digite a senha de acesso"
            autocomplete="current-password"
            required>
        </div>
        <button type="submit" id="login-btn" class="login-btn">
          <i class="fas fa-sign-in-alt"></i>
          <span>ENTRAR</span>
        </button>
        <div id="login-error" class="login-error"></div>
      </form>

      <div class="login-footer">
        <i class="fas fa-shield-alt"></i>
        Acesso restrito à liderança
      </div>
    </div>
  </div>

  <!-- ============================================================
       APP (só aparece depois do login)
       ============================================================ -->
  <div id="app-root" class="app-root" style="display: none;">

    <!-- Sidebar (desktop) / Drawer (mobile) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="fas fa-church"></i>
        </div>
        <div class="sidebar-brand">
          <span class="sidebar-title">PIBENS <span class="text-amber-400">ADM</span></span>
          <span class="sidebar-tagline">Gestão eclesiástica</span>
        </div>
        <button id="sidebar-close" class="sidebar-close" onclick="Menu.close()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Preenchido por js/menu.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar">
            <i class="fas fa-user-shield"></i>
          </div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name">Administrador</span>
            <span class="sidebar-user-role">Acesso total</span>
          </div>
        </div>
        <button class="sidebar-logout" onclick="Auth.logout()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- Overlay do drawer (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="Menu.close()"></div>

    <!-- Área principal -->
    <main class="main-content">

      <!-- Topbar -->
      <header class="topbar">
        <button class="topbar-menu" onclick="Menu.open()">
          <i class="fas fa-bars"></i>
        </button>

        <div class="topbar-title" id="topbar-title">
          <i class="fas fa-home"></i>
          <span>Início</span>
        </div>

        <div class="topbar-actions">
          <span id="topbar-date" class="topbar-date">
            <i class="fas fa-calendar-day"></i>
            <span>--</span>
          </span>
        </div>
      </header>

      <!-- Banners (aniversariantes + calendário batista) -->
      <div id="banners" class="banners-container"></div>

      <!-- Conteúdo do módulo atual -->
      <section id="content" class="content">
        <div class="loading-screen">
          <i class="fas fa-sync fa-spin"></i>
          <p>Carregando...</p>
        </div>
      </section>

      <!-- Rodapé -->
      <footer class="app-footer">
        <span>PIBENS ADM &copy; <span id="footer-year"></span></span>
        <span class="app-footer-version">v2.0</span>
      </footer>

    </main>

  </div>

  <!-- ============================================================
       MODAL UNIVERSAL (usado por todos os módulos)
       ============================================================ -->
  <div id="modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Título</h2>
        <button class="modal-close" onclick="UI.closeModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Conteúdo dinâmico -->
      </div>
      <div id="modal-footer" class="modal-footer">
        <!-- Botões dinâmicos -->
      </div>
    </div>
  </div>

  <!-- ============================================================
       TOAST (notificações)
       ============================================================ -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ============================================================
       SCRIPTS — carregados em ordem
       ============================================================ -->
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/menu.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/membros.js"></script>
  <script src="./js/talentos.js"></script>
  <script src="./js/agenda.js"></script>
  <script src="./js/ia.js"></script>

  <!-- Inicialização -->
  <script src="./js/app.js"></script>

</body>
</html>
