<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>PIBENS ADM</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Outfit', sans-serif; background: #f8fafc; }
    .btn-huge { font-size: 1.1rem; font-weight: 800; padding: 1rem 2rem; border-radius: 1.2rem; transition: all 0.2s; }
    .btn-huge:hover { transform: translateY(-2px); }
    #modal-overlay { background: rgba(15,23,42,0.7); backdrop-filter: blur(8px); display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: white; width: 100%; max-width: 700px; max-height: 90vh; border-radius: 2rem; overflow-y: auto; padding: 2rem; }
    input, select, textarea { width: 100%; padding: 1rem; border-radius: 1rem; border: 2px solid #e2e8f0; margin-top: 0.5rem; }
    input:focus { border-color: #3b82f6; outline: none; }
    .menu-card { transition: all 0.3s; border-radius: 2rem; cursor: pointer; }
    .menu-card:hover { transform: scale(1.03); }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; top: 20px; right: 20px; background: #1e293b; color: #fff; padding: 1rem 1.5rem; border-radius: 1rem; z-index: 999; opacity: 0; transform: translateY(-20px); transition: all 0.3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="pb-12">

  <!-- ============================================================
       API_URL — endpoint /exec do seu Apps Script (PIBENS ADM API)
       ============================================================ -->
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwUl-1KPF40lIc8FR8itFEYVkq5XhQlNXVvM6D_Hp2-3a2gaVAwg1AX1gZFS0hcaPeS_w/exec';
  </script>

  <div id="toast" class="toast"></div>

  <!-- MODAL -->
  <div id="modal-overlay">
    <div class="modal-content">
      <div class="flex justify-between items-center mb-6">
        <h2 id="modal-title" class="text-blue-900 font-black text-2xl">Formulário</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-3xl">&times;</button>
      </div>
      <form id="dynamic-form" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="form-row-index">
        <input type="hidden" id="form-sheet-name">
        <div id="form-fields-container"></div>
        <button type="submit" id="submit-btn" class="btn-huge bg-blue-600 text-white w-full mt-8">
          <i class="fas fa-save mr-2"></i> SALVAR
        </button>
      </form>
    </div>
  </div>

  <!-- NAV -->
  <nav class="bg-white shadow-xl border-b-4 border-blue-500 mb-6 px-6 py-5 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="loadDashboard()">
        <div class="bg-blue-600 text-white p-3 rounded-2xl"><i class="fas fa-church text-2xl"></i></div>
        <div>
          <h1 class="text-blue-600 m-0 text-2xl font-extrabold leading-none">PIBENS <span class="text-amber-500">ADM</span></h1>
          <p class="text-gray-500 text-xs mt-1">Gestão eclesiástica com inteligência</p>
        </div>
      </div>
      <div class="flex flex-wrap justify-center gap-2">
        <button onclick="loadDashboard()" class="text-gray-700 hover:text-blue-600 hover:bg-blue-50 px-3 py-2 rounded-xl font-bold"><i class="fas fa-home mr-1"></i>Início</button>
        <button onclick="loadSection('Membros')" class="text-gray-700 hover:text-emerald-600 hover:bg-emerald-50 px-3 py-2 rounded-xl font-bold"><i class="fas fa-users mr-1"></i>Membros</button>
        <button onclick="loadSection('BancoTalentos')" class="text-gray-700 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-xl font-bold"><i class="fas fa-star mr-1"></i>Talentos</button>
        <button onclick="loadSection('Agenda')" class="text-gray-700 hover:text-cyan-600 hover:bg-cyan-50 px-3 py-2 rounded-xl font-bold"><i class="fas fa-calendar-alt mr-1"></i>Agenda</button>
        <button onclick="loadIA()" class="text-gray-700 hover:text-rose-600 hover:bg-rose-50 px-3 py-2 rounded-xl font-bold"><i class="fas fa-robot mr-1"></i>IA</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 mb-4 text-right">
    <span id="live-date" class="bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm">
      <i class="fas fa-calendar-day mr-2"></i> Carregando...
    </span>
  </div>

  <div id="banners-container" class="max-w-7xl mx-auto px-4 mb-8 grid grid-cols-1 md:grid-cols-2 gap-6"></div>

  <main id="app-container" class="max-w-7xl mx-auto px-4">
    <div class="text-center py-20 bg-white rounded-3xl shadow">
      <i class="fas fa-sync fa-spin text-5xl text-blue-500 mb-4"></i>
      <h2 class="text-blue-900 font-black">Abrindo painel...</h2>
    </div>
  </main>

  <script>
    let currentSheet = "";
    let currentData = [];

    // ==================== API ====================
    async function chamarAPI(funcao, args = []) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 25000);
      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          cache: 'no-store',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ funcao, args }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const txt = await resp.text();
        let json;
        try { json = JSON.parse(txt); }
        catch (e) { throw new Error('Resposta inválida do servidor: ' + txt.substring(0, 200)); }
        if (!json.ok) throw new Error(json.erro || 'Erro desconhecido');
        return json.data;
      } catch (e) {
        clearTimeout(timeoutId);
        if (e.name === 'AbortError') throw new Error('Tempo esgotado (25s). Verifique sua conexão.');
        throw e;
      }
    }

    // ==================== TOAST ====================
    function showToast(msg, ms = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    // ==================== BANNERS ====================
    async function loadBanners() {
      const wrap = document.getElementById('banners-container');
      try {
        const info = await chamarAPI('getHomeBanners');
        if (info.todayStr) document.getElementById('live-date').innerHTML = '<i class="fas fa-calendar-alt mr-2"></i>Hoje: ' + info.todayStr;

        const birthHtml = (info.birthdays && info.birthdays.length > 0)
          ? `<div class="bg-gradient-to-r from-amber-400 to-orange-500 rounded-3xl p-6 flex items-center gap-4">
               <div class="bg-white/30 p-3 rounded-2xl text-2xl text-white"><i class="fas fa-birthday-cake"></i></div>
               <div>
                 <h4 class="font-extrabold text-lg text-amber-950">ANIVERSARIANTE(S) DO DIA!</h4>
                 <p class="font-bold text-white">${info.birthdays.join(', ')}</p>
               </div>
             </div>`
          : `<div class="bg-white rounded-3xl p-6 flex items-center gap-4 border">
               <div class="bg-slate-100 p-3 rounded-2xl text-2xl text-gray-400"><i class="fas fa-calendar-day"></i></div>
               <div>
                 <h4 class="font-bold text-gray-700">Aniversariantes de Hoje</h4>
                 <p class="text-gray-500 text-sm">Nenhum membro faz aniversário hoje.</p>
               </div>
             </div>`;

        const baptistHtml = `<div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-3xl p-6 flex items-center gap-4">
               <div class="bg-white/20 p-3 rounded-2xl text-2xl text-amber-400"><i class="fas fa-bookmark"></i></div>
               <div>
                 <h4 class="font-extrabold text-blue-100">CALENDÁRIO BATISTA CBB</h4>
                 <p class="font-semibold text-white">${info.baptistDates || ''}</p>
               </div>
             </div>`;

        wrap.innerHTML = birthHtml + baptistHtml;
      } catch (e) {
        wrap.innerHTML = `<div class="bg-red-100 text-red-800 rounded-2xl p-4 col-span-2">Erro ao carregar banners: ${e.message}</div>`;
      }
    }

    // ==================== DASHBOARD ====================
    function loadDashboard() {
      document.getElementById('app-container').innerHTML = `
        <div class="text-center mb-8">
          <h2 class="text-gray-800 font-black text-3xl">Painel de Controle</h2>
          <p class="text-gray-600">Selecione uma área para gerenciar.</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div onclick="loadSection('Membros')" class="menu-card bg-white border-2 border-emerald-400 shadow-lg p-6">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-4"><i class="fas fa-users text-2xl"></i></div>
            <h3 class="text-emerald-900 font-bold text-xl mb-1">Membros</h3>
            <p class="text-gray-500">Controle de dados e aniversários.</p>
          </div>
          <div onclick="loadSection('BancoTalentos')" class="menu-card bg-white border-2 border-purple-400 shadow-lg p-6">
            <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mb-4"><i class="fas fa-star text-2xl"></i></div>
            <h3 class="text-purple-900 font-bold text-xl mb-1">Talentos</h3>
            <p class="text-gray-500">Ministérios, dons e profissões.</p>
          </div>
          <div onclick="loadSection('Agenda')" class="menu-card bg-white border-2 border-cyan-400 shadow-lg p-6">
            <div class="w-14 h-14 bg-cyan-100 text-cyan-600 rounded-2xl flex items-center justify-center mb-4"><i class="fas fa-calendar-alt text-2xl"></i></div>
            <h3 class="text-cyan-900 font-bold text-xl mb-1">Agenda</h3>
            <p class="text-gray-500">Cultos e atividades.</p>
          </div>
          <div onclick="loadIA()" class="menu-card bg-white border-2 border-rose-400 shadow-lg p-6 md:col-span-3">
            <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mb-4"><i class="fas fa-robot text-2xl"></i></div>
            <h3 class="text-rose-900 font-bold text-xl mb-1">Assistente IA (Gemini)</h3>
            <p class="text-gray-500">Devocional, resumo de agenda, dúvidas bíblicas e relatório mensal.</p>
          </div>
        </div>`;
    }

    // ==================== SEÇÃO CRUD ====================
    async function loadSection(sheetName) {
      currentSheet = sheetName;
      document.getElementById('app-container').innerHTML = `
        <div class="text-center py-20 bg-white rounded-3xl shadow">
          <i class="fas fa-sync fa-spin text-5xl text-blue-500 mb-4"></i>
          <h3 class="text-blue-900 font-bold">Carregando ${sheetName}...</h3>
        </div>`;
      try {
        const data = await chamarAPI('listarRegistros', [sheetName]);
        currentData = data || [];
        renderTable(sheetName, currentData);
      } catch (e) {
        document.getElementById('app-container').innerHTML = `
          <div class="bg-red-100 text-red-800 p-6 rounded-2xl">
            <h3 class="font-black text-xl">Erro ao carregar</h3>
            <p>${e.message}</p>
            <button onclick="loadDashboard()" class="btn-huge bg-blue-600 text-white mt-4">Voltar</button>
          </div>`;
      }
    }

    function sortDataAlphabetically() {
      if (!currentData || currentData.length <= 1) return;
      const headers = Object.keys(currentData[0]).filter(k => k !== 'sheetRowIndex');
      const sortKey = headers.find(h => h.toLowerCase().trim() === 'nome') || headers[0];
      currentData.sort((a, b) => {
        const va = (a[sortKey] || '').toString().trim().toLowerCase();
        const vb = (b[sortKey] || '').toString().trim().toLowerCase();
        return va.localeCompare(vb, 'pt-BR', { sensitivity: 'base' });
      });
      renderTable(currentSheet, currentData);
    }

    function renderTable(sheetName, data) {
      const c = document.getElementById('app-container');
      if (!data || data.length === 0) {
        c.innerHTML = `
          <div class="text-center bg-white p-10 rounded-3xl shadow">
            <h2 class="font-bold text-gray-700">Nenhum registro em ${sheetName}</h2>
            <button onclick="openForm()" class="btn-huge bg-blue-600 text-white mt-4">+ ADICIONAR PRIMEIRO</button>
            <button onclick="loadDashboard()" class="btn-huge bg-amber-400 text-slate-900 mt-4 ml-2">Voltar</button>
          </div>`;
        return;
      }

      const headers = Object.keys(data[0]).filter(k => k !== 'sheetRowIndex');
      let html = `
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
          <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 flex flex-col lg:flex-row justify-between items-center gap-4">
            <div>
              <h2 class="text-white font-black text-2xl">${sheetName}</h2>
              <p class="text-blue-100">${data.length} registros</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="sortDataAlphabetically()" class="bg-sky-600 text-white font-bold px-4 py-2 rounded-xl"><i class="fas fa-sort-alpha-down mr-1"></i>A-Z</button>
              <button onclick="openForm()" class="bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl"><i class="fas fa-plus mr-1"></i>Inserir</button>
              <button onclick="loadDashboard()" class="bg-amber-400 text-slate-900 font-bold px-4 py-2 rounded-xl"><i class="fas fa-chevron-left mr-1"></i>Voltar</button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-slate-800 text-white">
                <tr>${headers.map(h => `<th class="p-4 text-left">${h}</th>`).join('')}<th class="p-4">Ações</th></tr>
              </thead>
              <tbody>
                ${data.map(row => {
                  let cells = headers.map(h => `<td class="p-4 border-b">${row[h] || '-'}</td>`).join('');
                  cells += `<td class="p-4 border-b text-center">
                    <button onclick="openForm(${row.sheetRowIndex})" class="bg-amber-500 text-white font-bold px-3 py-2 rounded-lg mr-1"><i class="fas fa-edit"></i></button>
                    <button onclick="askDelete(${row.sheetRowIndex})" class="bg-rose-500 text-white font-bold px-3 py-2 rounded-lg"><i class="fas fa-trash"></i></button>
                  </td>`;
                  return `<tr class="hover:bg-blue-50">${cells}</tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
      c.innerHTML = html;
    }

    // ==================== FORM ====================
    function openForm(rowIndex = null) {
      const modal = document.getElementById('modal-overlay');
      const container = document.getElementById('form-fields-container');
      document.getElementById('modal-title').innerText = rowIndex ? 'Editar Registro' : 'Novo em ' + currentSheet;
      document.getElementById('form-row-index').value = rowIndex || '';
      document.getElementById('form-sheet-name').value = currentSheet;

      const headers = Object.keys(currentData[0] || {}).filter(k => k !== 'sheetRowIndex');
      const fields = headers.length > 0 ? headers : ['Nome', 'Nascimento', 'Telefone'];
      const activeRow = rowIndex ? currentData.find(r => r.sheetRowIndex == rowIndex) : {};

      container.innerHTML = fields.map(h => {
        const isDate = /data|nascimento|aniversario/i.test(h);
        let val = activeRow[h] || '';
        if (isDate && val.includes('/')) {
          const p = val.split('/');
          if (p.length === 3) val = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
        }
        return `<div><label class="block font-bold text-gray-700 mt-4">${h}</label>
                <input type="${isDate ? 'date' : 'text'}" name="${h}" value="${val}"></div>`;
      }).join('');

      modal.style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const rowIndex = document.getElementById('form-row-index').value;
      const sheetName = document.getElementById('form-sheet-name').value;
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner mr-2"></span> SALVANDO...';
      try {
        const res = await chamarAPI('salvarRegistro', [sheetName, data, rowIndex ? parseInt(rowIndex) : null]);
        showToast(res.message || 'Salvo!');
        closeModal();
        loadBanners();
        loadSection(sheetName);
      } catch (err) {
        showToast('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save mr-2"></i> SALVAR';
      }
    }

    async function askDelete(rowIndex) {
      if (!confirm('Confirma a remoção?')) return;
      try {
        const res = await chamarAPI('removerRegistro', [rowIndex]);
        showToast(res.message || 'Removido!');
        loadBanners();
        loadSection(currentSheet);
      } catch (e) {
        showToast('Erro: ' + e.message);
      }
    }

    // ==================== IA ====================
    function loadIA() {
      document.getElementById('app-container').innerHTML = `
        <div class="text-center mb-8">
          <h2 class="text-rose-900 font-black text-3xl"><i class="fas fa-robot mr-2"></i>Assistente IA</h2>
          <p class="text-gray-600">Powered by Google Gemini</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white rounded-3xl shadow-lg p-6">
            <h3 class="font-black text-rose-800 mb-2"><i class="fas fa-book-bible mr-2"></i>Devocional Diário</h3>
            <button onclick="runIA('devocionalDiario', [])" class="btn-huge bg-rose-600 text-white w-full">Gerar</button>
          </div>
          <div class="bg-white rounded-3xl shadow-lg p-6">
            <h3 class="font-black text-rose-800 mb-2"><i class="fas fa-calendar-check mr-2"></i>Resumir Agenda</h3>
            <button onclick="runIA('resumirAgenda', [])" class="btn-huge bg-rose-600 text-white w-full">Gerar</button>
          </div>
          <div class="bg-white rounded-3xl shadow-lg p-6 md:col-span-2">
            <h3 class="font-black text-rose-800 mb-2"><i class="fas fa-question-circle mr-2"></i>Dúvida Bíblica</h3>
            <input id="duvida-input" placeholder="Ex: O que significa João 3:16?">
            <button onclick="runIADuvida()" class="btn-huge bg-rose-600 text-white w-full mt-2">Perguntar</button>
          </div>
          <div class="bg-white rounded-3xl shadow-lg p-6 md:col-span-2">
            <h3 class="font-black text-rose-800 mb-2"><i class="fas fa-chart-line mr-2"></i>Relatório Mensal</h3>
            <button onclick="runIA('relatorioMensal', [])" class="btn-huge bg-rose-600 text-white w-full">Gerar Relatório</button>
          </div>
          <div id="ia-result" class="md:col-span-2 bg-white rounded-3xl shadow-lg p-6 hidden">
            <h3 class="font-black text-rose-800 mb-2">Resposta</h3>
            <div id="ia-output" class="whitespace-pre-wrap text-gray-800"></div>
          </div>
        </div>`;
    }

    async function runIA(funcao, args) {
      const box = document.getElementById('ia-result');
      const out = document.getElementById('ia-output');
      box.classList.remove('hidden');
      out.innerHTML = '<span class="spinner mr-2"></span> Consultando IA...';
      try {
        const res = await chamarAPI(funcao, args);
        out.textContent = res.texto || JSON.stringify(res);
      } catch (e) {
        out.textContent = 'Erro: ' + e.message;
      }
    }

    function runIADuvida() {
      const q = document.getElementById('duvida-input').value.trim();
      if (!q) return showToast('Digite a dúvida primeiro.');
      runIA('duvidaBiblica', [q]);
    }

    // ==================== SERVICE WORKER ====================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // ==================== INIT ====================
    window.addEventListener('load', () => {
      loadBanners();
      loadDashboard();
    });
  </script>
</body>
</html>
